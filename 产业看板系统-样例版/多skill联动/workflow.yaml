workflow:
  name: excel_catalog_to_financial_curation
  project_root: "C:/Users/11/Documents/Selecting skill"
  python: "C:/Users/11/Documents/Selecting skill/.venv/Scripts/python.exe"
  provider: mock
  rules: input/selection_rules.docx
  run_root: "C:/Users/11/Documents/多skill联动/workflow_runs"
  final_output: "C:/Users/11/Documents/多skill联动/output/<input_stem>_workflow.xlsx"
  steps:
    - id: excel_catalog_curator
      name: Excel完整指标目录生成
      runner: excel_catalog_curator
      enabled: true
      params:
        script: C:/Users/11/Documents/market-ai-dashboard/skills/excel-catalog-curator/scripts/catalog.py
        output_name: cataloged.xlsx
        pickle_name: dataset.pkl

    - id: financial_variable_curation
      name: 金融变量筛选与目录标记
      runner: financial_variable_directory_mark
      enabled: true
      params:
        output_name: directory_marked.xlsx
        database_name: curation.db
        artifacts_dir: skill2_artifacts
        timeout_ms: 1800000

    - id: calculate_net_exports
      name: 净出口计算
      runner: command
      enabled: true
      in_place: true
      params:
        timeout_ms: 900000
        command:
          - 'C:/Users/11/Documents/Selecting skill/.venv/Scripts/python.exe'
          - 'C:/Users/11/Documents/多skill联动/scripts/calculate_net_exports.py'
          - '{input}'

    - id: composite_metric_stage
      name: Composite Metric Stage
      runner: composite_metric_stage
      enabled: true
      in_place: true
      params:
        timeout_ms: 1800000

    - id: apply_tin_selection_rules
      name: 锡指标确定性筛选
      runner: tin_selection_rules
      enabled: true
      in_place: true

    - id: generate_stock_targets
      name: Skill3 个股标的生成
      runner: stock_target_curator
      enabled: true
      in_place: true
      params:
        industry: tin

    - id: dashboard_data_sorter
      name: Skill4 看板数据排序
      runner: dashboard_data_sorter
      enabled: true
      in_place: true
      params:
        timeout_ms: 1800000

    - id: reclassify_directory
      name: 历史目录分类重映射
      runner: reclassify_directory
      enabled: false
      in_place: true

    - id: sync_market_dashboard
      name: 同步到市场看板文件
      runner: copy_file
      enabled: false
      params:
        target: C:/Users/11/Documents/market-ai-dashboard/output_processed_final_v5.xlsx
