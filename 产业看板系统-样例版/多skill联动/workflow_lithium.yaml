workflow:
  final_output: C:/Users/11/Documents/多skill联动/output/<input_stem>_workflow.xlsx
  name: lithium_chain_excel_catalog_to_financial_curation
  project_root: C:/Users/11/Documents/Selecting skill
  provider: mock
  python: C:/Users/11/Documents/Selecting skill/.venv/Scripts/python.exe
  rules: C:/Users/11/Documents/Selecting skill/input/selection_rules.docx
  run_root: C:/Users/11/Documents/多skill联动/workflow_runs
  steps:
  - enabled: true
    id: excel_catalog_curator
    name: 碳酸锂产业链指标目录生成
    params:
      output_name: cataloged.xlsx
      pickle_name: dataset.pkl
      script: C:/Users/11/Documents/多skill联动/scripts/lithium_catalog.py
    runner: excel_catalog_curator
  - enabled: true
    id: financial_variable_curation
    name: 金融变量筛选与目录标记
    params:
      artifacts_dir: skill2_artifacts
      database_name: curation.db
      output_name: directory_marked.xlsx
      timeout_ms: 7200000
    runner: financial_variable_directory_mark
  # 净出口 → 指标标签 → 复合指标 合并为单进程（一次 load/save），
  # 与原逐步执行输出一致（scripts/workflow_merged_stage.py）
  - enabled: true
    id: calculate_net_exports
    name: 净出口与复合指标计算（合并链）
    runner: command
    in_place: true
    params:
      timeout_ms: 1800000
      command:
        - 'C:/Users/11/Documents/Selecting skill/.venv/Scripts/python.exe'
        - 'C:/Users/11/Documents/多skill联动/scripts/workflow_merged_stage.py'
        - '--input'
        - '{input}'
        - '--output'
        - '{output}'
        - '--report'
        - '{run_dir}/composite_metric_report.json'
        - '--tags-report'
        - '{run_dir}/indicator_tag_report.md'
  - enabled: true
    id: generate_stock_targets
    name: Skill3 个股标的生成
    runner: stock_target_curator
    in_place: true
    params:
      industry: lithium
      provider: deepseek
  # 排序只在 pipeline 外围执行一次（selection 追加成交持仓比行之后），
  # 避免 workflow 内 + 外围重复排序两轮完整文件 load/save。
  # 与"排两次"结果等价：外围步骤不改行序，最终一次排序覆盖全部行。
  - enabled: false
    id: dashboard_data_sorter
    name: Skill4 看板数据排序
    runner: dashboard_data_sorter
    in_place: true
    params:
      timeout_ms: 1800000
