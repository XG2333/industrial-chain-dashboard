[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-variable-curation"
version = "0.1.0"
description = "Rule-pluggable financial variable curation workflow with Excel inspection and deterministic selection."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "python-docx>=1.2",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
ai = [
    "openai>=2.0",
]

[project.scripts]
fvc = "financial_variable_curation.cli:app"
financial-variable-curation = "financial_variable_curation.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live_api: tests that make real LLM API calls and are skipped by default",
]
